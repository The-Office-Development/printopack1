# Cloudflare Pages + D1 configuration for Printopack.
#
# D1 is the only binding, on purpose: uploaded pictures and the published snapshot live in
# it too, so the whole site runs on products that do not ask for a payment method. There is
# deliberately no R2 bucket here (see "Why not R2" in BACKEND_MIGRATION_PLAN.md).
#
# Bindings can also be set in the Pages dashboard; this file lets `wrangler` do the schema
# load, seed import, and local dev.

name = "printopack"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Content database (does not pause on the free tier)
[[d1_databases]]
binding = "DB"
database_name = "printopack"
database_id = "69f1feed-217e-482f-998a-9e7d08294d3b"

# Secrets (DEPLOY_HOOK_URL) are set with `wrangler pages secret put`, never in this file.
# CONTENT_URL is set as a build variable in the Pages dashboard and points at this site's
# own /content route, e.g. https://printopack.pages.dev/content
